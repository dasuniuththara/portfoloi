<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medilisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1a"/>
      <stop offset="100%" stop-color="#081e3a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#medilisGrad)" stroke="#0284c7" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="52" fill="#07152b" stroke="#0f2b54" stroke-width="1"/>
  <circle cx="28" cy="26" r="5" fill="#ef4444"/>
  <circle cx="44" cy="26" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="26" r="5" fill="#10b981"/>
  <text x="85" y="32" font-family="-apple-system, sans-serif" font-weight="900" font-size="16" fill="#38bdf8">
    MEDILIS <tspan fill="#93c5fd">• Clinical Laboratory Analyzer Hub &amp; ASTM LIS2-A</tspan>
  </text>
  <rect x="670" y="14" width="105" height="26" rx="6" fill="#0284c7"/>
  <text x="686" y="31" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#fff">+ New Sample</text>

  <!-- Left: Connected Analyzers Grid (Selectra Pro M, PKL-125, Sysmex) -->
  <rect x="25" y="70" width="370" height="405" rx="10" fill="#040e1e" stroke="#0f2b54" stroke-width="1.5"/>
  <text x="45" y="98" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#38bdf8">Active Laboratory Analyzers</text>

  <!-- Machine 1: Selectra Pro M -->
  <rect x="40" y="115" width="340" height="95" rx="8" fill="#0b1c36" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="52" y="128" width="45" height="45" rx="6" fill="#0284c7" fill-opacity="0.2"/>
  <text x="64" y="157" font-size="20">🔬</text>
  <text x="110" y="142" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Selectra Pro M (Clinical Chemistry)</text>
  <text x="110" y="160" font-family="monospace" font-size="10" fill="#38bdf8">ID: MCN-SEL-01 • Protocol: CLSI LIS2-A</text>
  <text x="110" y="178" font-family="monospace" font-size="10" fill="#94a3b8">Port: COM3 (9600-8-N-1) • SecKey: MCN-5501</text>
  <rect x="300" y="128" width="68" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
  <text x="312" y="142" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">ONLINE</text>

  <!-- Machine 2: PKL-125 -->
  <rect x="40" y="225" width="340" height="95" rx="8" fill="#0b1c36" stroke="#1e3a8a" stroke-width="1"/>
  <rect x="52" y="238" width="45" height="45" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="64" y="267" font-size="20">🧪</text>
  <text x="110" y="252" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">PKL-125 Chemistry Analyzer</text>
  <text x="110" y="270" font-family="monospace" font-size="10" fill="#60a5fa">ID: MCN-PKL-02 • Serial RS232 Interface</text>
  <text x="110" y="288" font-family="monospace" font-size="10" fill="#94a3b8">Baud: 9600 • Auto Result Processing</text>
  <rect x="300" y="238" width="68" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
  <text x="312" y="252" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">ONLINE</text>

  <!-- Machine 3: Sysmex Hematology -->
  <rect x="40" y="335" width="340" height="85" rx="8" fill="#0b1c36" stroke="#1e3a8a" stroke-width="1"/>
  <rect x="52" y="348" width="45" height="45" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
  <text x="64" y="377" font-size="20">🩸</text>
  <text x="110" y="362" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Sysmex XN-350 (Hematology CBC)</text>
  <text x="110" y="380" font-family="monospace" font-size="10" fill="#a78bfa">Protocol: ASTM 1394 • TCP/IP 192.168.1.150</text>
  <text x="110" y="398" font-family="monospace" font-size="10" fill="#94a3b8">Bidirectional ENQ/ACK Handshake</text>
  <rect x="300" y="348" width="68" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
  <text x="312" y="362" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">ONLINE</text>

  <!-- Left Bottom status bar -->
  <rect x="40" y="430" width="340" height="35" rx="6" fill="#030b14" stroke="#0f2b54"/>
  <text x="50" y="452" font-family="monospace" font-size="10" fill="#38bdf8">✔ SQLite Local DB Sync • COM &amp; TCP Ports Active</text>

  <!-- Right: Real-Time Ingested Lab Results & Barcode Sample Tracking -->
  <rect x="415" y="70" width="360" height="405" rx="10" fill="#040e1e" stroke="#0f2b54" stroke-width="1.5"/>
  <text x="435" y="98" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Live Diagnostic Results &amp; Barcode Ingestion</text>

  <!-- Sample Tube Barcode Banner -->
  <rect x="435" y="115" width="320" height="65" rx="6" fill="#0b1c36" stroke="#0284c7"/>
  <text x="450" y="135" font-family="monospace" font-size="11" fill="#93c5fd">TUBE BARCODE: ||| | |||| | |||||| |||</text>
  <text x="450" y="152" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">SAMPLE: #MCN-2026-0891 • PATIENT: K. Silva (48Y / M)</text>
  <text x="450" y="168" font-family="monospace" font-size="10" fill="#34d399">Auto Ingested from Selectra Pro M via COM3</text>

  <!-- Test Results Table -->
  <rect x="435" y="190" width="320" height="225" rx="6" fill="#061224" stroke="#0f2b54"/>
  
  <rect x="440" y="196" width="310" height="24" rx="4" fill="#0b1c36"/>
  <text x="450" y="212" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8">TEST PARAMETER</text>
  <text x="580" y="212" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8">RESULT</text>
  <text x="660" y="212" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8">REF RANGE</text>

  <!-- Row 1 -->
  <text x="450" y="240" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Fasting Blood Glucose</text>
  <text x="580" y="240" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">94 mg/dL</text>
  <text x="660" y="240" font-family="monospace" font-size="10" fill="#94a3b8">70 - 99</text>

  <!-- Row 2 -->
  <text x="450" y="270" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Serum Cholesterol</text>
  <text x="580" y="270" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">218 mg/dL</text>
  <text x="660" y="270" font-family="monospace" font-size="10" fill="#94a3b8">&lt; 200</text>

  <!-- Row 3 -->
  <text x="450" y="300" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Serum Creatinine</text>
  <text x="580" y="300" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">0.92 mg/dL</text>
  <text x="660" y="300" font-family="monospace" font-size="10" fill="#94a3b8">0.7 - 1.3</text>

  <!-- Row 4 -->
  <text x="450" y="330" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">SGPT / ALT (Liver)</text>
  <text x="580" y="330" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">28 U/L</text>
  <text x="660" y="330" font-family="monospace" font-size="10" fill="#94a3b8">7 - 56</text>

  <!-- Row 5 -->
  <text x="450" y="360" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Hemoglobin (Hb)</text>
  <text x="580" y="360" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">14.6 g/dL</text>
  <text x="660" y="360" font-family="monospace" font-size="10" fill="#94a3b8">13.8 - 17.2</text>

  <!-- Verification badge -->
  <rect x="435" y="425" width="320" height="40" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7"/>
  <text x="450" y="449" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">✔ Auto Verified &amp; Ready for PDF Lab Report Export</text>
</svg>
