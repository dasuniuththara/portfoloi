    <rect x="210" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="218" y="142" font-family="monospace" font-size="10" fill="#64748b">C5</text>

    <!-- Key 9: D5 -->
    <rect x="240" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="248" y="142" font-family="monospace" font-size="10" fill="#64748b">D5</text>

    <!-- Key 10: E5 -->
    <rect x="270" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="278" y="142" font-family="monospace" font-size="10" fill="#64748b">E5</text>

    <!-- Key 11: F5 -->
    <rect x="300" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="308" y="142" font-family="monospace" font-size="10" fill="#64748b">F5</text>

    <!-- Key 12: G5 -->
    <rect x="330" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="338" y="142" font-family="monospace" font-size="10" fill="#64748b">G5</text>

    <!-- Key 13: A5 -->
    <rect x="360" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <text x="368" y="142" font-family="monospace" font-size="10" fill="#64748b">A5</text>

    <!-- Black Keys -->
    <rect x="18" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="48" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="108" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="138" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="168" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="228" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="258" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="318" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
    <rect x="348" y="0" width="18" height="95" rx="2" fill="#0f172a"/>
  </g>

  <!-- Bottom video HUD stats -->
  <rect x="40" y="425" width="430" height="35" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="50" y="447" font-family="monospace" font-size="10" fill="#f59e0b">LATENCY: 18.4ms • HARMONY: C Major Triad (C4-E4-G4) • MODE: Adaptive Disability Assist</text>

  <!-- Right: Adaptive Assistance & MIDI Intelligence -->
  <rect x="500" y="70" width="275" height="405" rx="12" fill="#080f21" stroke="#1e293b" stroke-width="1.5"/>
  <text x="515" y="98" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Adaptive Performance Telemetry</text>

  <!-- Mode Card -->
  <rect x="515" y="115" width="245" height="85" rx="8" fill="#181308" stroke="#d97706" stroke-width="1"/>
  <text x="525" y="136" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#fde68a">ACCESSIBILITY ASSIST MODE: ON</text>
  <text x="525" y="155" font-family="-apple-system, sans-serif" font-size="10" fill="#fef3c7">User input: Melody line only (Single hand)</text>
  <text x="525" y="172" font-family="-apple-system, sans-serif" font-weight="600" font-size="10" fill="#60a5fa">Robot Action: Real-time harmonic chord fill</text>
  <text x="525" y="188" font-family="monospace" font-size="9" fill="#94a3b8">Synchronization jitter: &lt; 2.1 ms</text>

  <!-- Velocity & Dynamics Meter -->
  <rect x="515" y="210" width="245" height="75" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="525" y="231" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">KEY STRIKE DYNAMICS (VELOCITY)</text>
  <text x="525" y="258" font-family="-apple-system, sans-serif" font-weight="bold" font-size="18" fill="#f59e0b">88 (Mezzo-Forte mf)</text>
  <text x="525" y="275" font-family="monospace" font-size="9" fill="#34d399">PWM Duty Cycle: 68% • 12V High-Speed</text>

  <!-- MIDI Stream Terminal -->
  <rect x="515" y="295" width="245" height="165" rx="8" fill="#030712" stroke="#1e293b"/>
  <text x="525" y="318" font-family="monospace" font-size="10" fill="#38bdf8">[MIDI IN] NoteOn: 60 (C4) Vel: 84</text>
  <text x="525" y="338" font-family="monospace" font-size="10" fill="#f59e0b">[LSTM MODEL] Predicted Chord: C Major</text>
  <text x="525" y="358" font-family="monospace" font-size="10" fill="#34d399">[ACTUATOR 3] Strike E4 (Key 64)</text>
  <text x="525" y="378" font-family="monospace" font-size="10" fill="#34d399">[ACTUATOR 5] Strike G4 (Key 67)</text>
  <text x="525" y="398" font-family="monospace" font-size="10" fill="#60a5fa">[AUDIO SYNC] Polyphonic sound verified</text>
  <text x="525" y="425" font-family="monospace" font-size="9" fill="#a855f7">✔ Acoustic latency: 18.4ms (Indiscernible)</text>
</svg>
