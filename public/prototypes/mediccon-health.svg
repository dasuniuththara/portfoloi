<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09203f"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#medBg)" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="52" fill="#0b172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="26" r="5" fill="#ef4444"/>
  <circle cx="44" cy="26" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="26" r="5" fill="#10b981"/>
  <text x="85" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#38bdf8">
    MEDICCON <tspan fill="#60a5fa">Healthcare Hub</tspan>
  </text>
  <rect x="670" y="14" width="105" height="26" rx="6" fill="#2563eb"/>
  <text x="686" y="31" font-family="-apple-system, sans-serif" font-weight="bold" font-size="11" fill="#fff">+ New Patient</text>

  <!-- Left Sidebar -->
  <rect x="0" y="52" width="170" height="448" fill="#071120" stroke="#1e293b" stroke-width="1"/>
  <rect x="15" y="75" width="140" height="32" rx="6" fill="#1d4ed8" fill-opacity="0.3" stroke="#2563eb"/>
  <text x="35" y="96" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">🏥 Dashboard</text>
  <text x="35" y="135" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">📅 Appointments</text>
  <text x="35" y="170" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">👨‍⚕️ Doctors Roster</text>
  <text x="35" y="205" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">📋 Electronic EMR</text>
  <text x="35" y="240" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">💊 Pharmacy &amp; Rx</text>

  <!-- Main Content -->
  <!-- Header KPI row -->
  <rect x="195" y="75" width="180" height="75" rx="10" fill="url(#blueCard)" stroke="#1e3a8a"/>
  <text x="210" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#93c5fd">TODAY'S APPOINTMENTS</text>
  <text x="210" y="130" font-family="-apple-system, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">48 Patients</text>

  <rect x="390" y="75" width="180" height="75" rx="10" fill="url(#blueCard)" stroke="#1e3a8a"/>
  <text x="405" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#93c5fd">ON-DUTY SPECIALISTS</text>
  <text x="405" y="130" font-family="-apple-system, sans-serif" font-weight="bold" font-size="22" fill="#38bdf8">14 Doctors</text>

  <rect x="585" y="75" width="185" height="75" rx="10" fill="url(#blueCard)" stroke="#1e3a8a"/>
  <text x="600" y="100" font-family="-apple-system, sans-serif" font-size="11" fill="#93c5fd">CLINIC BED OCCUPANCY</text>
  <text x="600" y="130" font-family="-apple-system, sans-serif" font-weight="bold" font-size="22" fill="#34d399">82% (28/34)</text>

  <!-- Live Patient Queue & Schedule Table -->
  <rect x="195" y="170" width="575" height="305" rx="10" fill="#0b1329" stroke="#1e293b"/>
  <text x="215" y="200" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Active Patient Queue &amp; Consultation Schedule</text>

  <!-- Table Header -->
  <rect x="210" y="215" width="545" height="28" rx="4" fill="#1e293b"/>
  <text x="225" y="233" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">PATIENT</text>
  <text x="355" y="233" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">DOCTOR / DEPT</text>
  <text x="495" y="233" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">TIME</text>
  <text x="600" y="233" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">STATUS</text>

  <!-- Row 1 -->
  <text x="225" y="265" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Amara Jayasinghe</text>
  <text x="355" y="265" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Dr. Senanayake (Cardiology)</text>
  <text x="495" y="265" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">10:30 AM</text>
  <rect x="595" y="250" width="85" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="608" y="265" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399">In Consult</text>

  <!-- Row 2 -->
  <text x="225" y="305" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Kavinda Perera</text>
  <text x="355" y="305" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Dr. De Silva (Neurology)</text>
  <text x="495" y="305" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">11:00 AM</text>
  <rect x="595" y="290" width="85" height="22" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="612" y="305" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa">Waiting</text>

  <!-- Row 3 -->
  <text x="225" y="345" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Nuwan Fernando</text>
  <text x="355" y="345" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Dr. Wickramasinghe (General)</text>
  <text x="495" y="345" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">11:30 AM</text>
  <rect x="595" y="330" width="85" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="612" y="345" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">Triaged</text>

  <!-- Row 4 -->
  <text x="225" y="385" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Dilani Wickrama</text>
  <text x="355" y="385" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">Dr. Senanayake (Cardiology)</text>
  <text x="495" y="385" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">12:00 PM</text>
  <rect x="595" y="370" width="85" height="22" rx="4" fill="#64748b" fill-opacity="0.2"/>
  <text x="608" y="385" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1">Scheduled</text>

  <!-- Bottom status -->
  <rect x="210" y="420" width="545" height="40" rx="6" fill="#071120" stroke="#1e293b"/>
  <text x="225" y="445" font-family="monospace" font-size="11" fill="#38bdf8">✔ HL7 / FHIR Patient Records Synchronized • Server Latency 21ms</text>
</svg>
