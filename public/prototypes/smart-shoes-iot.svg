<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c1e"/>
      <stop offset="100%" stop-color="#041215"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#iotBg)" stroke="#0d9488" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="50" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
  <circle cx="28" cy="25" r="5" fill="#ef4444"/>
  <circle cx="44" cy="25" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="25" r="5" fill="#10b981"/>
  <text x="85" y="31" font-family="-apple-system, monospace" font-weight="bold" font-size="14" fill="#2dd4bf">
    SENSOPATH IoT: Smart Assistive Footwear &amp; Telemetry
  </text>
  <rect x="660" y="14" width="115" height="24" rx="12" fill="#0f766e"/>
  <text x="675" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ccfbf1">● BLE Connected</text>

  <!-- Left: Sensor Architecture & Physical Diagram -->
  <rect x="25" y="70" width="370" height="405" rx="12" fill="#022c22" stroke="#134e4a" stroke-width="1"/>
  <text x="45" y="100" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#5eead4">Hardware &amp; Haptic Actuators</text>

  <!-- Shoe Sole Mockup Outline -->
  <path d="M 120 180 Q 90 280, 110 390 Q 150 420, 190 390 Q 210 280, 180 180 Q 150 140, 120 180 Z" fill="#042f2e" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="110" y="290" font-family="monospace" font-size="11" fill="#99f6e4">Foot Sensor Bed</text>

  <!-- Ultrasonic Sensors -->
  <circle cx="150" cy="160" r="14" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
  <text x="144" y="165" font-size="12">📡</text>
  <text x="210" y="165" font-family="monospace" font-size="10" fill="#a7f3d0">Front Obstacle Sensor (0.1m - 3.5m)</text>

  <!-- Left/Right Vibration Actuators -->
  <circle cx="115" cy="240" r="10" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5"/>
  <text x="50" y="245" font-family="monospace" font-size="10" fill="#fde68a">Left Haptic</text>

  <circle cx="185" cy="240" r="10" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5"/>
  <text x="210" y="245" font-family="monospace" font-size="10" fill="#fde68a">Right Haptic Motor</text>

  <!-- Heel Pressure & Fall Detection -->
  <circle cx="150" cy="370" r="12" fill="#ef4444" stroke="#fee2e2" stroke-width="2"/>
  <text x="143" y="375" font-size="11">⚠️</text>
  <text x="210" y="375" font-family="monospace" font-size="10" fill="#fca5a5">IMU Fall &amp; Stumble Detect</text>

  <!-- Microcontroller stats -->
  <rect x="40" y="420" width="340" height="42" rx="8" fill="#041f1e" stroke="#115e59"/>
  <text x="55" y="445" font-family="monospace" font-size="10" fill="#5eead4">MCU: ESP32-WROOM-32D • 240MHz • 802.15.1 BLE 5.0</text>

  <!-- Right: Real-time Telemetry Dashboard -->
  <rect x="415" y="70" width="360" height="405" rx="12" fill="#041f1e" stroke="#134e4a" stroke-width="1"/>
  <text x="435" y="100" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13" fill="#2dd4bf">Live Mobile Telemetry &amp; Alerts</text>

  <!-- Obstacle Distance Gauge -->
  <rect x="435" y="120" width="320" height="75" rx="8" fill="#022c22" stroke="#115e59"/>
  <text x="450" y="145" font-family="-apple-system, sans-serif" font-size="11" fill="#99f6e4">PROXIMITY WARNING</text>
  <text x="450" y="175" font-family="-apple-system, sans-serif" font-weight="bold" font-size="22" fill="#34d399">1.4 m Ahead — Path Clear</text>

  <!-- Haptic Frequency Status -->
  <rect x="435" y="210" width="150" height="75" rx="8" fill="#022c22" stroke="#115e59"/>
  <text x="445" y="235" font-family="-apple-system, sans-serif" font-size="10" fill="#99f6e4">VIBRATION PULSE</text>
  <text x="445" y="265" font-family="-apple-system, sans-serif" font-weight="bold" font-size="18" fill="#5eead4">240 Hz Mild</text>

  <!-- Battery & Status -->
  <rect x="605" y="210" width="150" height="75" rx="8" fill="#022c22" stroke="#115e59"/>
  <text x="615" y="235" font-family="-apple-system, sans-serif" font-size="10" fill="#99f6e4">LI-ION BATTERY</text>
  <text x="615" y="265" font-family="-apple-system, sans-serif" font-weight="bold" font-size="18" fill="#34d399">94% (18h Left)</text>

  <!-- Event Log Terminal -->
  <rect x="435" y="300" width="320" height="155" rx="8" fill="#011816" stroke="#0d9488"/>
  <text x="448" y="325" font-family="monospace" font-size="10" fill="#5eead4">[11:42:01] Ultrasonic ping: 2.1m (No Hazard)</text>
  <text x="448" y="348" font-family="monospace" font-size="10" fill="#5eead4">[11:42:04] Step detected: Right foot gait normal</text>
  <text x="448" y="371" font-family="monospace" font-size="10" fill="#fbbf24">[11:42:07] Left curb detected at 0.8m -> Haptic L triggered</text>
  <text x="448" y="394" font-family="monospace" font-size="10" fill="#34d399">[11:42:09] Obstacle avoided successfully. Path restored.</text>
  <text x="448" y="420" font-family="monospace" font-size="10" fill="#a7f3d0">● System Status: Autonomous &amp; Fully Calibrated</text>
</svg>
